<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="rgba(255,255,255,0.18)" stroke-width="2" filter="url(#shadow)" />

  <!-- Currency Arrows & Symbol -->
  <!-- Top Right Arrow -->
  <path d="M 40 48 L 84 48 M 74 38 L 84 48 L 74 58" fill="none" stroke="url(#glow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Left Arrow -->
  <path d="M 88 80 L 44 80 M 54 70 L 44 80 L 54 90" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Currency Badge -->
  <circle cx="64" cy="64" r="14" fill="#0f172a" stroke="rgba(56,189,248,0.5)" stroke-width="2" />
  <text x="64" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">$</text>
</svg>